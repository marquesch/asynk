[project]
site_name = "asynk"
site_url = "https://marquesch.github.io/asynk/"
repo_url = "https://github.com/marquesch/asynk"
docs_dir = "docs"
site_dir = "site"
exclude_docs = """
superpowers/
"""
nav = [
  { "Home" = "index.md" },
]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
